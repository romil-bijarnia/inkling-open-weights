name: Neural Atlas

on:
  push:
    branches: [main, "feature/neural-atlas-v1"]
    paths:
      - "NEURAL_ATLAS.md"
      - "neural-atlas/**"
      - ".github/workflows/neural-atlas.yml"
  pull_request:
    paths:
      - "NEURAL_ATLAS.md"
      - "neural-atlas/**"
      - ".github/workflows/neural-atlas.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: neural-atlas/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e "./neural-atlas[dev]"
      - name: Run exactness and API tests
        run: pytest neural-atlas/tests

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neural-atlas/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm install
      - name: Build production interface
        run: npm run build

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t neural-atlas:test neural-atlas
